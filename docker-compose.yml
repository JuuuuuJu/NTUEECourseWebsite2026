# Production deployment for course.ntuee.org (Service ID: course).
# Local preview: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

name: course

services:
  web:
    build:
      context: ./prod-support/nginx
    restart: unless-stopped
    expose:
      - "80"
    networks:
      default:
      nginx:
        aliases:
          - course
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: ./prod-support/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"

  backend:
    build:
      context: .
      dockerfile: ./prod-support/backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISTRIBUTE_SERVER_HOST: distribute
      DISTRIBUTE_SERVER_PORT: 8001
      BACKUP_DIR: /app/tmp/db-backups
    volumes:
      - course-db-backups:/app/tmp/db-backups
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      distribute:
        condition: service_started
      init:
        condition: service_completed_successfully

  # One-shot schema migration and first-admin setup; exits after finishing.
  init:
    build:
      context: .
      dockerfile: ./prod-support/backend/Dockerfile
    command: ["npm", "run", "migrate:2021-to-2026"]
    restart: "no"
    env_file:
      - .env
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8.0.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    expose:
      - "27017"
    volumes:
      - course-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  distribute:
    build:
      context: .
      dockerfile: ./prod-support/distribute-server/Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DBNAME: ${MONGO_DBNAME}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: admin

networks:
  nginx:
    external: true

# Keep the volume names created by the previous ntueecoursewebsite2026
# project so the existing production data is reused as-is.
volumes:
  course-mongo-data:
    name: ntueecoursewebsite2026_course-mongo-data
  course-db-backups:
    name: ntueecoursewebsite2026_course-db-backups
