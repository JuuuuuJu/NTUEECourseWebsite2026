# This file is used for production, not for development!

version: "3.4"

services:
  nginx:
    container_name: course-nginx
    build:
      context: ./prod-support/nginx
      dockerfile: ./Dockerfile
    ports:
      - "3000:80"
    networks:
      - course
      - nginx
    depends_on:
      - course-frontend
      - course-backend
      - course-distribute-server
    links:
      - course-frontend
      - course-backend
  course-frontend:
    container_name: course-frontend
    build:
      context: .
      dockerfile: ./prod-support/frontend/Dockerfile
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    networks:
      - course
    environment:
      - REACT_APP_API_HOST=course-backend
    links:
      - course-backend
  course-backend:
    container_name: course-backend
    build:
      context: .
      dockerfile: ./prod-support/backend/Dockerfile
    expose:
      - "8000"
    networks:
      - course
    depends_on:
      - course-mongodb
      - course-redisdb
    env_file:
      - .env
    environment:
      - DISTRIBUTE_SERVER_HOST=course-distribute-server
      - DISTRIBUTE_SERVER_PORT=8001
      - MONGO_HOST=course-mongodb
      - REDIS_HOST=course-redisdb
      - BACKUP_DIR=/app/tmp/db-backups
    links:
      - course-distribute-server
    volumes:
      - course-db-backups:/app/tmp/db-backups

  course-mongodb:
    container_name: course-mongo
    image: mongo:5.0.2
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    expose:
      - "27017"
    networks:
      - course
    volumes:
      - course-mongo-data:/data/db

  course-redisdb:
    container_name: course-redis
    image: redis
    expose:
      - "6379"
    networks:
      - course

  course-distribute-server:
    container_name: course-distribute
    build:
      context: .
      dockerfile: ./prod-support/distribute-server/Dockerfile
    expose:
      - "8001"
    networks:
      - course
    env_file:
      - .env
    environment:
      - MONGO_HOST=course-mongodb
      - MONGO_PORT=27017
      - MONGO_DBNAME=${MONGO_DBNAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}

networks:
  nginx:
    external: true
  course:

volumes:
  course-mongo-data:
  course-db-backups:
